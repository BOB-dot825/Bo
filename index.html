<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PONG</h1>
        <div class="scoreboard">
            <div class="score-section">
                <h2>Player</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="score-section">
                <h2>Computer</h2>
                <p id="computerScore">0</p>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <p><strong>Controls:</strong></p>
            <p>🖱️ Mouse Y-position or ⬆️⬇️ Arrow Keys to move your paddle</p>
            <p>Click "Start Game" or press SPACEBAR to begin</p>
        </div>
        
        <button id="startBtn" class="start-btn">Start Game</button>
        <button id="resetBtn" class="reset-btn">Reset Score</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
